name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install maintainer dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run repository validation
        run: npm test

      - name: Check local skill discovery and payload hygiene
        shell: bash
        run: |
          set -euo pipefail
          discovery="$(npx --yes skills@1.5.21 add . --list)"
          printf '%s\n' "$discovery"
          grep -q 'codebase-to-course' <<<"$discovery"

          probe_dir="$RUNNER_TEMP/skill-install-probe"
          mkdir -p "$probe_dir"
          cd "$probe_dir"
          npx --yes skills@1.5.21 add "$GITHUB_WORKSPACE" -a codex -y --copy

          skill_file="$(find "$probe_dir" -type f -path '*/codebase-to-course/SKILL.md' -print -quit)"
          test -n "$skill_file"
          skill_dir="$(dirname "$skill_file")"
          test -f "$skill_dir/references/build.mjs"
          test -f "$skill_dir/references/evidence-contract.md"
          test -f "$skill_dir/scripts/escape-html.mjs"
          test -f "$skill_dir/scripts/fingerprint-evidence.mjs"
          test -f "$skill_dir/scripts/excerpt-hash.mjs"
          test -f "$skill_dir/scripts/check-staleness.mjs"
          node --check "$skill_dir/references/build.mjs"

          unexpected="$(find "$skill_dir" -mindepth 1 -maxdepth 1 \
            ! -name SKILL.md ! -name agents ! -name references ! -name scripts -print)"
          if test -n "$unexpected"; then
            echo "Unexpected top-level files leaked into the skill payload:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          if find "$skill_dir" \( -name .impeccable -o -name package.json -o -name package-lock.json -o -name README.md -o -name test.mjs \) -print -quit | grep -q .; then
            echo 'Maintainer-only files leaked into the installed skill payload.' >&2
            exit 1
          fi
